name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: npm run lint
      
    - name: Run type checking
      run: npm run compile
      
    - name: Create store packages
      run: npm run zip:all
      
    - name: Create Release
      uses: actions/create-release@v1
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        body: |
          Release ${{ github.ref }}
          
          ## Chrome Web Store
          Use `ci-browser-extension-*-chrome.zip` for Chrome Web Store submission.
          
          ## Firefox Add-ons
          Use `ci-browser-extension-*-firefox.zip` and `ci-browser-extension-*-sources.zip` for Firefox Add-ons submission.
        
    - name: Upload Chrome Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: .output/ci-browser-extension-*-chrome.zip
        asset_name: ci-browser-extension-${{ github.ref_name }}-chrome.zip
        asset_content_type: application/zip
        
    - name: Upload Firefox Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: .output/ci-browser-extension-*-firefox.zip
        asset_name: ci-browser-extension-${{ github.ref_name }}-firefox.zip
        asset_content_type: application/zip
        
    - name: Upload Firefox Sources
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: .output/ci-browser-extension-*-sources.zip
        asset_name: ci-browser-extension-${{ github.ref_name }}-sources.zip
        asset_content_type: application/zip