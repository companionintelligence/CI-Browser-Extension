name: Release

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     tags:
#       - 'v*'
# <<< ci-local:gated
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish (must match package.json, e.g. v1.6.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    # Store-credential gates MUST live at job level.
    #
    # These flags used to be declared in each publish step's own `env:` block and
    # read back from that same step's `if:` (e.g. `if: env.CHROME_CLIENT_ID != ''`).
    # A step's `if:` is evaluated before that step's `env:` is applied, so the
    # `env` context there only ever contains workflow- and job-level variables —
    # the expression was reading an undefined value, compared it to '', and was
    # therefore ALWAYS FALSE. Every store publish step silently skipped on every
    # release, including Firefox, whose AMO credentials have been present since
    # 2026-07-29. The workflow still reported green, so nothing surfaced it.
    #
    # Hoisting the gates here is the same pattern CI-Hub (desktop-release.yml)
    # and CI-Capture (release.yml) already use for their signing gates.
    env:
      FIREFOX_READY: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' && 'true' || 'false' }}
      CHROME_READY: ${{ secrets.CHROME_CLIENT_ID != '' && secrets.CHROME_CLIENT_SECRET != '' && secrets.CHROME_REFRESH_TOKEN != '' && secrets.CHROME_EXTENSION_ID != '' && 'true' || 'false' }}
      EDGE_READY: ${{ secrets.EDGE_PRODUCT_ID != '' && secrets.EDGE_CLIENT_ID != '' && secrets.EDGE_API_KEY != '' && 'true' || 'false' }}
      # Per-secret presence, so the preflight can name exactly what is missing.
      HAS_AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER != '' && 'true' || 'false' }}
      HAS_AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET != '' && 'true' || 'false' }}
      HAS_CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID != '' && 'true' || 'false' }}
      HAS_CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET != '' && 'true' || 'false' }}
      HAS_CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN != '' && 'true' || 'false' }}
      HAS_CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID != '' && 'true' || 'false' }}
      HAS_EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID != '' && 'true' || 'false' }}
      HAS_EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID != '' && 'true' || 'false' }}
      HAS_EDGE_API_KEY: ${{ secrets.EDGE_API_KEY != '' && 'true' || 'false' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate release tag
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      shell: bash
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Release tag must use the vMAJOR.MINOR.PATCH form (for example, v1.6.0)." >&2
          exit 1
        fi
        package_version=$(node -p "require('./package.json').version")
        if [[ "$RELEASE_TAG" != "v${package_version}" ]]; then
          echo "Tag $RELEASE_TAG does not match package version $package_version." >&2
          exit 1
        fi

    # Runs before install/build so a credential gap costs seconds, not a full
    # release build, and so the tag author sees the failure immediately.
    - name: Require store publishing credentials
      shell: bash
      env:
        STORE_PUBLISH_OPTIONAL: ${{ vars.STORE_PUBLISH_OPTIONAL }}
      run: |
        set -euo pipefail

        # Comma-separated store keys (firefox, chrome, edge) that are allowed to
        # have NO credentials at all. Waiving a store means its zip is attached
        # to the release for manual upload and nothing auto-publishes. A store
        # that is only PARTIALLY configured always fails, waived or not — half a
        # credential set is a mistake, never an intentional opt-out.
        waived=",$(printf '%s' "${STORE_PUBLISH_OPTIONAL:-}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]'),"
        fatal=0

        check_store() {
          local key="$1" label="$2" howto="$3"
          shift 3
          local missing=() present=0 total=0 name flag
          while [ "$#" -gt 0 ]; do
            name="$1"; flag="$2"; shift 2
            total=$((total + 1))
            if [ "$flag" = "true" ]; then
              present=$((present + 1))
            else
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "$label: all $total credentials present — this release will submit to the store."
            return 0
          fi

          if [ "$present" -gt 0 ]; then
            echo "::error::$label is PARTIALLY configured ($present of $total secrets set). Missing: ${missing[*]}. A partial credential set cannot publish, and skipping it silently is what this check exists to prevent. Set the missing secrets, or clear all $total to waive the store deliberately."
            fatal=1
            return 0
          fi

          if [[ "$waived" == *",$key,"* ]]; then
            echo "::warning::$label has no publishing credentials and is waived via the STORE_PUBLISH_OPTIONAL repository variable. The store package is still attached to the release for manual upload. $howto"
            return 0
          fi

          echo "::error::$label has NO publishing credentials, so this release would not reach the store. Missing all $total: ${missing[*]}. $howto"
          echo "::error::Set them with 'gh secret set <NAME> --repo ${{ github.repository }}', or waive the store on purpose by adding '$key' to the STORE_PUBLISH_OPTIONAL repository variable."
          fatal=1
        }

        check_store firefox "Firefox Add-ons (AMO)" \
          "See PUBLISHING.md -> CI/CD Auto-Publish Setup." \
          AMO_JWT_ISSUER "$HAS_AMO_JWT_ISSUER" \
          AMO_JWT_SECRET "$HAS_AMO_JWT_SECRET"

        check_store chrome "Chrome Web Store" \
          "See PUBLISHING.md -> CI/CD Auto-Publish Setup." \
          CHROME_EXTENSION_ID "$HAS_CHROME_EXTENSION_ID" \
          CHROME_CLIENT_ID "$HAS_CHROME_CLIENT_ID" \
          CHROME_CLIENT_SECRET "$HAS_CHROME_CLIENT_SECRET" \
          CHROME_REFRESH_TOKEN "$HAS_CHROME_REFRESH_TOKEN"

        check_store edge "Microsoft Edge Add-ons" \
          "See PUBLISHING.md -> CI/CD Auto-Publish Setup." \
          EDGE_PRODUCT_ID "$HAS_EDGE_PRODUCT_ID" \
          EDGE_CLIENT_ID "$HAS_EDGE_CLIENT_ID" \
          EDGE_API_KEY "$HAS_EDGE_API_KEY"

        # Safari has no publish API at all; it stays a manual Xcode step by
        # design and is deliberately not gated here (see PUBLISHING.md).
        echo "Safari: no store upload API exists — manual Xcode submission, not gated."

        if [ "$fatal" -ne 0 ]; then
          echo "::error::Release aborted: at least one store cannot receive a submission. A green release must mean every non-waived store accepted this build for review."
          exit 1
        fi

        echo "All store credential checks passed."

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        registry-url: "https://npm.pkg.github.com"
        scope: "@companionintelligence"

    - name: Enable Corepack (yarn 4)
      run: corepack enable

    - name: Install dependencies
      run: yarn install --immutable
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run linting
      run: yarn lint

    - name: Run type checking
      run: yarn compile

    - name: Create store packages
      # WXT bakes WXT_* into the artifact at build time; an extension has no
      # runtime environment. Unset secret => the builds carry no DSN and report
      # nothing, which is a valid release, not a failure.
      # See docs/operations/error-reporting.md.
      env:
        WXT_SENTRY_DSN: ${{ secrets.SENTRY_DSN_BROWSER_EXTENSION }}
      run: yarn prepare:store

    - name: Create Release
      uses: actions/create-release@v1
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ inputs.release_tag }}
        release_name: Release ${{ inputs.release_tag }}
        draft: false
        prerelease: false
        body: |
          Release ${{ inputs.release_tag }}

          ## Chrome Web Store
          Use `ci-browser-extension-*-chrome.zip` for Chrome Web Store submission.

          ## Firefox Add-ons
          Use `ci-browser-extension-*-firefox.zip` and `ci-browser-extension-*-sources.zip` for Firefox Add-ons submission.

          ## Microsoft Edge Add-ons
          Use `ci-browser-extension-*-edge.zip` for Edge Add-ons submission (same package as Chrome; Edge is
          Chromium-based).

          ## Safari (App Store)
          `ci-browser-extension-*-safari.zip` (desktop) and `ci-browser-extension-*-safari-mobile.zip` (iOS) are
          the raw web-extension bundles. Safari has no store-upload API — unzip one, run it through
          `xcrun safari-web-extension-converter` to generate the Xcode wrapper, then archive/notarize/submit from
          Xcode. See PUBLISHING.md for the full manual walkthrough.

          ---
          Chrome, Firefox, and Edge auto-publish to their stores from this workflow when the relevant secrets are
          configured (see PUBLISHING.md → "CI/CD Auto-Publish Setup"). If those secrets aren't set yet, the zips
          above are still attached for manual upload.

    - name: Resolve Chrome Release Asset Path
      id: chrome_asset
      run: printf 'asset=%s\n' .output/ci-browser-extension-*-chrome.zip >> "$GITHUB_OUTPUT"

    - name: Upload Chrome Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.chrome_asset.outputs.asset }}
        asset_name: ci-browser-extension-${{ inputs.release_tag }}-chrome.zip
        asset_content_type: application/zip

    - name: Resolve Firefox Release Asset Path
      id: firefox_asset
      run: printf 'asset=%s\n' .output/ci-browser-extension-*-firefox.zip >> "$GITHUB_OUTPUT"

    - name: Upload Firefox Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.firefox_asset.outputs.asset }}
        asset_name: ci-browser-extension-${{ inputs.release_tag }}-firefox.zip
        asset_content_type: application/zip

    - name: Resolve Firefox Sources Asset Path
      id: sources_asset
      run: printf 'asset=%s\n' .output/ci-browser-extension-*-sources.zip >> "$GITHUB_OUTPUT"

    - name: Upload Firefox Sources
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.sources_asset.outputs.asset }}
        asset_name: ci-browser-extension-${{ inputs.release_tag }}-sources.zip
        asset_content_type: application/zip

    - name: Resolve Safari Release Asset Path
      id: safari_asset
      run: printf 'asset=%s\n' .output/ci-browser-extension-*-safari.zip >> "$GITHUB_OUTPUT"

    - name: Upload Safari Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.safari_asset.outputs.asset }}
        asset_name: ci-browser-extension-${{ inputs.release_tag }}-safari.zip
        asset_content_type: application/zip

    - name: Resolve Safari Mobile Release Asset Path
      id: safari_mobile_asset
      run: printf 'asset=%s\n' .output/ci-browser-extension-*-safari-mobile.zip >> "$GITHUB_OUTPUT"

    - name: Upload Safari Mobile Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.safari_mobile_asset.outputs.asset }}
        asset_name: ci-browser-extension-${{ inputs.release_tag }}-safari-mobile.zip
        asset_content_type: application/zip

    - name: Resolve Edge Release Asset Path
      id: edge_asset
      run: printf 'asset=%s\n' .output/ci-browser-extension-*-edge.zip >> "$GITHUB_OUTPUT"

    - name: Upload Edge Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.edge_asset.outputs.asset }}
        asset_name: ci-browser-extension-${{ inputs.release_tag }}-edge.zip
        asset_content_type: application/zip

    # ---------------------------------------------------------------------
    # Store auto-publish. Each step is gated on a JOB-level readiness flag
    # (see the `env:` block at the top of this job) — never on the step's own
    # `env:`, which is not yet applied when `if:` is evaluated and made these
    # gates permanently false. "Require store publishing credentials" above has
    # already failed the run for any non-waived store with missing credentials,
    # so a skip here can only mean a deliberate STORE_PUBLISH_OPTIONAL waiver.
    # See PUBLISHING.md → "CI/CD Auto-Publish Setup" for how to obtain each
    # store's secrets. Safari has no publish API and stays a manual, Xcode-based
    # step (see the "Safari (App Store)" section of PUBLISHING.md).
    # ---------------------------------------------------------------------

    - name: Publish to Firefox Add-ons (AMO)
      id: publish_firefox
      if: env.FIREFOX_READY == 'true'
      env:
        AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
        AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      run: |
        set -euo pipefail
        npx --yes web-ext@10 sign \
          --source-dir .output/firefox-mv2 \
          --artifacts-dir .output/amo-artifacts \
          --api-key "$AMO_JWT_ISSUER" \
          --api-secret "$AMO_JWT_SECRET" \
          --channel listed

    - name: Publish to Chrome Web Store
      id: publish_chrome
      if: env.CHROME_READY == 'true'
      env:
        CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
        CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
        CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      run: |
        set -euo pipefail
        CHROME_ZIP=$(ls .output/ci-browser-extension-*-chrome.zip)
        npx --yes chrome-webstore-upload-cli@4 upload \
          --source "$CHROME_ZIP" \
          --extension-id "$CHROME_EXTENSION_ID" \
          --client-id "$CHROME_CLIENT_ID" \
          --client-secret "$CHROME_CLIENT_SECRET" \
          --refresh-token "$CHROME_REFRESH_TOKEN"
        npx --yes chrome-webstore-upload-cli@4 publish \
          --extension-id "$CHROME_EXTENSION_ID" \
          --client-id "$CHROME_CLIENT_ID" \
          --client-secret "$CHROME_CLIENT_SECRET" \
          --refresh-token "$CHROME_REFRESH_TOKEN"

    # v1.1 is the supported Microsoft Edge Add-ons Update API. It authenticates
    # with the Partner Center API key and Client ID; the old v1 bearer-token
    # flow was retired by Microsoft after 2024. The first listing still must be
    # created/submitted in Partner Center before this update API can be used.
    - name: Publish to Microsoft Edge Add-ons
      id: publish_edge
      if: env.EDGE_READY == 'true'
      env:
        EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
        EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail
        EDGE_ZIP=$(ls .output/ci-browser-extension-*-edge.zip)
        API_ROOT="https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID"
        TMP_DIR=$(mktemp -d)
        trap 'rm -rf "$TMP_DIR"' EXIT
        EDGE_AUTH_HEADERS=(
          -H "Authorization: ApiKey $EDGE_API_KEY"
          -H "X-ClientID: $EDGE_CLIENT_ID"
        )

        operation_id_from_headers() {
          local location
          location=$(awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); print $2 }' "$1" | tail -n 1)
          local operation_id="${location##*/}"
          operation_id="${operation_id%%\?*}"
          if [[ -z "$operation_id" || ! "$operation_id" =~ ^[[:alnum:]_.~-]+$ ]]; then
            echo "Edge API did not return a usable operation ID." >&2
            return 1
          fi
          printf '%s' "$operation_id"
        }

        wait_for_operation() {
          local url="$1" label="$2" response="$3" http_code status attempt
          for attempt in $(seq 1 30); do
            http_code=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              "${EDGE_AUTH_HEADERS[@]}" "$url")
            if [[ "$http_code" != "200" ]]; then
              echo "Edge $label status check returned HTTP $http_code." >&2
              return 1
            fi
            status=$(jq -r '.status // empty' "$response")
            echo "Edge $label status attempt $attempt/30: $status"
            case "$status" in
              Succeeded) return 0 ;;
              Failed)
                jq -r '"Edge operation failed: " + (.errorCode // "unknown") + ": " + (.message // "no details")' "$response" >&2
                return 1
                ;;
              InProgress) sleep 10 ;;
              *) echo "Edge API returned an unexpected $label status." >&2; return 1 ;;
            esac
          done
          echo "Timed out waiting for the Edge $label operation." >&2
          return 1
        }

        UPLOAD_HEADERS="$TMP_DIR/upload.headers"
        UPLOAD_BODY="$TMP_DIR/upload.json"
        UPLOAD_HTTP_CODE=$(curl --silent --show-error --dump-header "$UPLOAD_HEADERS" \
          --output "$UPLOAD_BODY" --write-out '%{http_code}' --request POST \
          "${EDGE_AUTH_HEADERS[@]}" \
          -H "Content-Type: application/zip" \
          --data-binary "@$EDGE_ZIP" \
          "$API_ROOT/submissions/draft/package")
        if [[ "$UPLOAD_HTTP_CODE" != "202" ]]; then
          echo "Edge package upload returned HTTP $UPLOAD_HTTP_CODE." >&2
          jq -r '.message // .errorCode // empty' "$UPLOAD_BODY" >&2 || true
          exit 1
        fi
        UPLOAD_OPERATION_ID=$(operation_id_from_headers "$UPLOAD_HEADERS")
        wait_for_operation \
          "$API_ROOT/submissions/draft/package/operations/$UPLOAD_OPERATION_ID" \
          "package upload" "$TMP_DIR/upload-status.json"

        PUBLISH_NOTES=$(jq -nc --arg notes "Companion Intelligence ${RELEASE_TAG} submission." '{notes: $notes}')
        PUBLISH_HEADERS="$TMP_DIR/publish.headers"
        PUBLISH_BODY="$TMP_DIR/publish.json"
        PUBLISH_HTTP_CODE=$(curl --silent --show-error --dump-header "$PUBLISH_HEADERS" \
          --output "$PUBLISH_BODY" --write-out '%{http_code}' --request POST \
          "${EDGE_AUTH_HEADERS[@]}" \
          -H "Content-Type: application/json" \
          --data "$PUBLISH_NOTES" \
          "$API_ROOT/submissions")
        if [[ "$PUBLISH_HTTP_CODE" != "202" ]]; then
          echo "Edge submission request returned HTTP $PUBLISH_HTTP_CODE." >&2
          jq -r '.message // .errorCode // empty' "$PUBLISH_BODY" >&2 || true
          exit 1
        fi
        PUBLISH_OPERATION_ID=$(operation_id_from_headers "$PUBLISH_HEADERS")
        wait_for_operation \
          "$API_ROOT/submissions/operations/$PUBLISH_OPERATION_ID" \
          "submission" "$TMP_DIR/publish-status.json"
        echo "Edge accepted the submission for certification; store review and public availability may still be pending."

    # Report actual submission-step results. Credentials being present does not
    # prove that a store accepted the submission or made it public.
    - name: Summarize store submissions
      if: always()
      shell: bash
      env:
        STORE_PUBLISH_OPTIONAL: ${{ vars.STORE_PUBLISH_OPTIONAL }}
        FIREFOX_RESULT: ${{ steps.publish_firefox.conclusion }}
        CHROME_RESULT: ${{ steps.publish_chrome.conclusion }}
        EDGE_RESULT: ${{ steps.publish_edge.conclusion }}
      run: |
        set -euo pipefail
        waived=",$(printf '%s' "${STORE_PUBLISH_OPTIONAL:-}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]'),"

        store_outcome() {
          local key="$1" result="$2" ready="$3" present=false flag
          shift 3
          case "$result" in
            success) echo 'submitted; store review/publication may be pending'; return ;;
            failure) echo 'failed; see publish-step logs'; return ;;
            cancelled) echo 'cancelled'; return ;;
          esac
          if [ "$ready" = 'true' ]; then
            echo 'not submitted; an earlier release step failed'
            return
          fi
          for flag in "$@"; do
            if [ "$flag" = 'true' ]; then
              present=true
            fi
          done
          if [ "$present" = 'true' ]; then
            echo 'blocked — partial credentials'
          elif [[ "$waived" == *",$key,"* ]]; then
            echo 'waived — manual upload required'
          else
            echo 'blocked — credentials missing'
          fi
        }

        {
          echo "## Store submissions"
          echo ""
          echo "| Store | Outcome |"
          echo "|---|---|"
          echo "| Firefox Add-ons (AMO) | $(store_outcome firefox "$FIREFOX_RESULT" "$FIREFOX_READY" "$HAS_AMO_JWT_ISSUER" "$HAS_AMO_JWT_SECRET") |"
          echo "| Chrome Web Store | $(store_outcome chrome "$CHROME_RESULT" "$CHROME_READY" "$HAS_CHROME_CLIENT_ID" "$HAS_CHROME_CLIENT_SECRET" "$HAS_CHROME_REFRESH_TOKEN" "$HAS_CHROME_EXTENSION_ID") |"
          echo "| Microsoft Edge Add-ons | $(store_outcome edge "$EDGE_RESULT" "$EDGE_READY" "$HAS_EDGE_PRODUCT_ID" "$HAS_EDGE_CLIENT_ID" "$HAS_EDGE_API_KEY") |"
          echo "| Safari (App Store) | manual — no publish API (see PUBLISHING.md) |"
        } >> "$GITHUB_STEP_SUMMARY"
