name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # Store-credential gates MUST live at job level.
    #
    # These flags used to be declared in each publish step's own `env:` block and
    # read back from that same step's `if:` (e.g. `if: env.CHROME_CLIENT_ID != ''`).
    # A step's `if:` is evaluated before that step's `env:` is applied, so the
    # `env` context there only ever contains workflow- and job-level variables —
    # the expression was reading an undefined value, compared it to '', and was
    # therefore ALWAYS FALSE. Every store publish step silently skipped on every
    # release, including Firefox, whose AMO credentials have been present since
    # 2026-07-29. The workflow still reported green, so nothing surfaced it.
    #
    # Hoisting the gates here is the same pattern CI-Hub (desktop-release.yml)
    # and CI-Capture (release.yml) already use for their signing gates.
    env:
      FIREFOX_READY: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' && 'true' || 'false' }}
      CHROME_READY: ${{ secrets.CHROME_CLIENT_ID != '' && secrets.CHROME_CLIENT_SECRET != '' && secrets.CHROME_REFRESH_TOKEN != '' && secrets.CHROME_EXTENSION_ID != '' && 'true' || 'false' }}
      EDGE_READY: ${{ secrets.EDGE_PRODUCT_ID != '' && secrets.EDGE_CLIENT_ID != '' && secrets.EDGE_CLIENT_SECRET != '' && secrets.EDGE_ACCESS_TOKEN_URL != '' && 'true' || 'false' }}
      # Per-secret presence, so the preflight can name exactly what is missing.
      HAS_AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER != '' && 'true' || 'false' }}
      HAS_AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET != '' && 'true' || 'false' }}
      HAS_CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID != '' && 'true' || 'false' }}
      HAS_CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET != '' && 'true' || 'false' }}
      HAS_CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN != '' && 'true' || 'false' }}
      HAS_CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID != '' && 'true' || 'false' }}
      HAS_EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID != '' && 'true' || 'false' }}
      HAS_EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID != '' && 'true' || 'false' }}
      HAS_EDGE_CLIENT_SECRET: ${{ secrets.EDGE_CLIENT_SECRET != '' && 'true' || 'false' }}
      HAS_EDGE_ACCESS_TOKEN_URL: ${{ secrets.EDGE_ACCESS_TOKEN_URL != '' && 'true' || 'false' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Runs before install/build so a credential gap costs seconds, not a full
    # release build, and so the tag author sees the failure immediately.
    - name: Require store publishing credentials
      shell: bash
      env:
        STORE_PUBLISH_OPTIONAL: ${{ vars.STORE_PUBLISH_OPTIONAL }}
      run: |
        set -euo pipefail

        # Comma-separated store keys (firefox, chrome, edge) that are allowed to
        # have NO credentials at all. Waiving a store means its zip is attached
        # to the release for manual upload and nothing auto-publishes. A store
        # that is only PARTIALLY configured always fails, waived or not — half a
        # credential set is a mistake, never an intentional opt-out.
        waived=",$(printf '%s' "${STORE_PUBLISH_OPTIONAL:-}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]'),"
        fatal=0

        check_store() {
          local key="$1" label="$2" howto="$3"
          shift 3
          local missing=() present=0 total=0 name flag
          while [ "$#" -gt 0 ]; do
            name="$1"; flag="$2"; shift 2
            total=$((total + 1))
            if [ "$flag" = "true" ]; then
              present=$((present + 1))
            else
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "$label: all $total credentials present — this release WILL publish to the store."
            return 0
          fi

          if [ "$present" -gt 0 ]; then
            echo "::error::$label is PARTIALLY configured ($present of $total secrets set). Missing: ${missing[*]}. A partial credential set cannot publish, and skipping it silently is what this check exists to prevent. Set the missing secrets, or clear all $total to waive the store deliberately."
            fatal=1
            return 0
          fi

          if [[ "$waived" == *",$key,"* ]]; then
            echo "::warning::$label has no publishing credentials and is waived via the STORE_PUBLISH_OPTIONAL repository variable. The store package is still attached to the release for manual upload. $howto"
            return 0
          fi

          echo "::error::$label has NO publishing credentials, so this release would not reach the store. Missing all $total: ${missing[*]}. $howto"
          echo "::error::Set them with 'gh secret set <NAME> --repo ${{ github.repository }}', or waive the store on purpose by adding '$key' to the STORE_PUBLISH_OPTIONAL repository variable."
          fatal=1
        }

        check_store firefox "Firefox Add-ons (AMO)" \
          "See PUBLISHING.md -> CI/CD Auto-Publish Setup." \
          AMO_JWT_ISSUER "$HAS_AMO_JWT_ISSUER" \
          AMO_JWT_SECRET "$HAS_AMO_JWT_SECRET"

        check_store chrome "Chrome Web Store" \
          "See PUBLISHING.md -> CI/CD Auto-Publish Setup." \
          CHROME_EXTENSION_ID "$HAS_CHROME_EXTENSION_ID" \
          CHROME_CLIENT_ID "$HAS_CHROME_CLIENT_ID" \
          CHROME_CLIENT_SECRET "$HAS_CHROME_CLIENT_SECRET" \
          CHROME_REFRESH_TOKEN "$HAS_CHROME_REFRESH_TOKEN"

        check_store edge "Microsoft Edge Add-ons" \
          "See PUBLISHING.md -> CI/CD Auto-Publish Setup." \
          EDGE_PRODUCT_ID "$HAS_EDGE_PRODUCT_ID" \
          EDGE_CLIENT_ID "$HAS_EDGE_CLIENT_ID" \
          EDGE_CLIENT_SECRET "$HAS_EDGE_CLIENT_SECRET" \
          EDGE_ACCESS_TOKEN_URL "$HAS_EDGE_ACCESS_TOKEN_URL"

        # Safari has no publish API at all; it stays a manual Xcode step by
        # design and is deliberately not gated here (see PUBLISHING.md).
        echo "Safari: no store upload API exists — manual Xcode submission, not gated."

        if [ "$fatal" -ne 0 ]; then
          echo "::error::Release aborted: at least one store cannot be published to. A green release must mean every non-waived store actually received this build."
          exit 1
        fi

        echo "All store credential checks passed."

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Enable Corepack (yarn 4)
      run: corepack enable

    - name: Install dependencies
      run: yarn install --immutable

    - name: Run linting
      run: yarn lint

    - name: Run type checking
      run: yarn compile

    - name: Create store packages
      # WXT bakes WXT_* into the artifact at build time; an extension has no
      # runtime environment. Unset secret => the builds carry no DSN and report
      # nothing, which is a valid release, not a failure.
      # See docs/operations/error-reporting.md.
      env:
        WXT_SENTRY_DSN: ${{ secrets.SENTRY_DSN_BROWSER_EXTENSION }}
      run: yarn prepare:store

    - name: Create Release
      uses: actions/create-release@v1
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        body: |
          Release ${{ github.ref }}

          ## Chrome Web Store
          Use `ci-browser-extension-*-chrome.zip` for Chrome Web Store submission.

          ## Firefox Add-ons
          Use `ci-browser-extension-*-firefox.zip` and `ci-browser-extension-*-sources.zip` for Firefox Add-ons submission.

          ## Microsoft Edge Add-ons
          Use `ci-browser-extension-*-edge.zip` for Edge Add-ons submission (same package as Chrome; Edge is
          Chromium-based).

          ## Safari (App Store)
          `ci-browser-extension-*-safari.zip` (desktop) and `ci-browser-extension-*-safari-mobile.zip` (iOS) are
          the raw web-extension bundles. Safari has no store-upload API — unzip one, run it through
          `xcrun safari-web-extension-converter` to generate the Xcode wrapper, then archive/notarize/submit from
          Xcode. See PUBLISHING.md for the full manual walkthrough.

          ---
          Chrome, Firefox, and Edge auto-publish to their stores from this workflow when the relevant secrets are
          configured (see PUBLISHING.md → "CI/CD Auto-Publish Setup"). If those secrets aren't set yet, the zips
          above are still attached for manual upload.

    - name: Resolve Chrome Release Asset Path
      id: chrome_asset
      run: echo "asset=$(ls .output/ci-browser-extension-*-chrome.zip)" >> $GITHUB_OUTPUT

    - name: Upload Chrome Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.chrome_asset.outputs.asset }}
        asset_name: ci-browser-extension-${{ github.ref_name }}-chrome.zip
        asset_content_type: application/zip

    - name: Resolve Firefox Release Asset Path
      id: firefox_asset
      run: echo "asset=$(ls .output/ci-browser-extension-*-firefox.zip)" >> $GITHUB_OUTPUT

    - name: Upload Firefox Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.firefox_asset.outputs.asset }}
        asset_name: ci-browser-extension-${{ github.ref_name }}-firefox.zip
        asset_content_type: application/zip

    - name: Resolve Firefox Sources Asset Path
      id: sources_asset
      run: echo "asset=$(ls .output/ci-browser-extension-*-sources.zip)" >> $GITHUB_OUTPUT

    - name: Upload Firefox Sources
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.sources_asset.outputs.asset }}
        asset_name: ci-browser-extension-${{ github.ref_name }}-sources.zip
        asset_content_type: application/zip

    - name: Resolve Safari Release Asset Path
      id: safari_asset
      run: echo "asset=$(ls .output/ci-browser-extension-*-safari.zip)" >> $GITHUB_OUTPUT

    - name: Upload Safari Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.safari_asset.outputs.asset }}
        asset_name: ci-browser-extension-${{ github.ref_name }}-safari.zip
        asset_content_type: application/zip

    - name: Resolve Safari Mobile Release Asset Path
      id: safari_mobile_asset
      run: echo "asset=$(ls .output/ci-browser-extension-*-safari-mobile.zip)" >> $GITHUB_OUTPUT

    - name: Upload Safari Mobile Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.safari_mobile_asset.outputs.asset }}
        asset_name: ci-browser-extension-${{ github.ref_name }}-safari-mobile.zip
        asset_content_type: application/zip

    - name: Resolve Edge Release Asset Path
      id: edge_asset
      run: echo "asset=$(ls .output/ci-browser-extension-*-edge.zip)" >> $GITHUB_OUTPUT

    - name: Upload Edge Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.edge_asset.outputs.asset }}
        asset_name: ci-browser-extension-${{ github.ref_name }}-edge.zip
        asset_content_type: application/zip

    # ---------------------------------------------------------------------
    # Store auto-publish. Each step is gated on a JOB-level readiness flag
    # (see the `env:` block at the top of this job) — never on the step's own
    # `env:`, which is not yet applied when `if:` is evaluated and made these
    # gates permanently false. "Require store publishing credentials" above has
    # already failed the run for any non-waived store with missing credentials,
    # so a skip here can only mean a deliberate STORE_PUBLISH_OPTIONAL waiver.
    # See PUBLISHING.md → "CI/CD Auto-Publish Setup" for how to obtain each
    # store's secrets. Safari has no publish API and stays a manual, Xcode-based
    # step (see the "Safari (App Store)" section of PUBLISHING.md).
    # ---------------------------------------------------------------------

    - name: Publish to Firefox Add-ons (AMO)
      if: env.FIREFOX_READY == 'true'
      env:
        AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
        AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      run: |
        set -euo pipefail
        npx --yes web-ext@10 sign \
          --source-dir .output/firefox-mv2 \
          --artifacts-dir .output/amo-artifacts \
          --api-key "$AMO_JWT_ISSUER" \
          --api-secret "$AMO_JWT_SECRET" \
          --channel listed

    - name: Publish to Chrome Web Store
      if: env.CHROME_READY == 'true'
      env:
        CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
        CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
        CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      run: |
        set -euo pipefail
        CHROME_ZIP=$(ls .output/ci-browser-extension-*-chrome.zip)
        npx --yes chrome-webstore-upload-cli@4 upload \
          --source "$CHROME_ZIP" \
          --extension-id "$CHROME_EXTENSION_ID" \
          --client-id "$CHROME_CLIENT_ID" \
          --client-secret "$CHROME_CLIENT_SECRET" \
          --refresh-token "$CHROME_REFRESH_TOKEN"
        npx --yes chrome-webstore-upload-cli@4 publish \
          --extension-id "$CHROME_EXTENSION_ID" \
          --client-id "$CHROME_CLIENT_ID" \
          --client-secret "$CHROME_CLIENT_SECRET" \
          --refresh-token "$CHROME_REFRESH_TOKEN"

    # NOTE: this step is unverified against a live Edge Partner Center account
    # (no Edge submission has been confirmed done yet, unlike Chrome/Firefox/
    # Safari). The request shapes below match Microsoft's documented
    # Add-ons API (https://learn.microsoft.com/en-us/microsoft-edge/extensions-chromium/publish/api/using-addons-api)
    # as of this writing — re-check that doc against Partner Center's actual
    # "API access" page before the first real run.
    - name: Publish to Microsoft Edge Add-ons
      if: env.EDGE_READY == 'true'
      env:
        EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
        EDGE_CLIENT_SECRET: ${{ secrets.EDGE_CLIENT_SECRET }}
        EDGE_ACCESS_TOKEN_URL: ${{ secrets.EDGE_ACCESS_TOKEN_URL }}
      run: |
        set -euo pipefail
        EDGE_ZIP=$(ls .output/ci-browser-extension-*-edge.zip)

        ACCESS_TOKEN=$(curl -sS -X POST "$EDGE_ACCESS_TOKEN_URL" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "client_id=$EDGE_CLIENT_ID" \
          -d "scope=https://api.addons.microsoftedge.microsoft.com/.default" \
          -d "client_secret=$EDGE_CLIENT_SECRET" \
          -d "grant_type=client_credentials" | jq -r '.access_token')

        if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
          echo "Failed to obtain an Edge Add-ons access token" >&2
          exit 1
        fi

        OPERATION_URL=$(curl -sS -D - -o /dev/null -X POST \
          "https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions/draft/package" \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "X-ClientID: $EDGE_CLIENT_ID" \
          -H "Content-Type: application/zip" \
          --data-binary "@$EDGE_ZIP" | grep -i '^location:' | tr -d '\r' | awk '{print $2}')

        STATUS="InProgress"
        for i in $(seq 1 30); do
          STATUS=$(curl -sS "$OPERATION_URL" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "X-ClientID: $EDGE_CLIENT_ID" | jq -r '.status')
          echo "Package upload status: $STATUS"
          [ "$STATUS" = "Succeeded" ] && break
          [ "$STATUS" = "Failed" ] && { echo "Edge package upload failed"; exit 1; }
          sleep 10
        done
        if [ "$STATUS" != "Succeeded" ]; then
          echo "Timed out waiting for Edge package validation" >&2
          exit 1
        fi

        curl -sS -X POST \
          "https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions" \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "X-ClientID: $EDGE_CLIENT_ID"

    # Writes the per-store outcome into the run summary so "what actually
    # shipped" is answerable from the Actions UI without reading step logs.
    - name: Summarize store publishing
      if: always()
      shell: bash
      run: |
        {
          echo "## Store publishing"
          echo ""
          echo "| Store | Outcome |"
          echo "|---|---|"
          echo "| Firefox Add-ons (AMO) | $([ "$FIREFOX_READY" = 'true' ] && echo 'published' || echo 'waived — manual upload required') |"
          echo "| Chrome Web Store | $([ "$CHROME_READY" = 'true' ] && echo 'published' || echo 'waived — manual upload required') |"
          echo "| Microsoft Edge Add-ons | $([ "$EDGE_READY" = 'true' ] && echo 'published' || echo 'waived — manual upload required') |"
          echo "| Safari (App Store) | manual — no publish API (see PUBLISHING.md) |"
        } >> "$GITHUB_STEP_SUMMARY"
