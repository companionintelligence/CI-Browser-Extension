name: Verify Store Credentials

# Manually-triggered, read-only sanity check for the store auto-publish
# secrets used by release.yml. Each step only obtains an auth token (or
# equivalent) — none of them upload, submit, or publish anything, so this is
# safe to run any time you add/rotate a secret. Steps for stores whose
# secrets aren't set are skipped, not failed.

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Job-level gates: a step's `if:` is evaluated before that step's own `env:`
    # is applied, so the previous `if: env.AMO_JWT_ISSUER != ''` form read an
    # undefined value and was always false. Every "Verify ..." step skipped and
    # every "... not configured" step ran, so this workflow reported "nothing is
    # configured" no matter which secrets existed. Same defect as release.yml.
    env:
      FIREFOX_READY: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' && 'true' || 'false' }}
      CHROME_READY: ${{ secrets.CHROME_CLIENT_ID != '' && secrets.CHROME_CLIENT_SECRET != '' && secrets.CHROME_REFRESH_TOKEN != '' && 'true' || 'false' }}
      EDGE_READY: ${{ secrets.EDGE_PRODUCT_ID != '' && secrets.EDGE_CLIENT_ID != '' && secrets.EDGE_API_KEY != '' && 'true' || 'false' }}
    steps:
    - name: Verify Firefox AMO credentials
      if: env.FIREFOX_READY == 'true'
      env:
        AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
        AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      run: |
        set -euo pipefail
        TOKEN=$(node -e '
          const crypto = require("crypto");
          const b64url = (input) => Buffer.from(input).toString("base64")
            .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
          const issuer = process.env.AMO_JWT_ISSUER;
          const secret = process.env.AMO_JWT_SECRET;
          const now = Math.floor(Date.now() / 1000);
          const header = { alg: "HS256", typ: "JWT" };
          const payload = { iss: issuer, jti: crypto.randomBytes(16).toString("hex"), iat: now, exp: now + 60 };
          const eh = b64url(JSON.stringify(header));
          const ep = b64url(JSON.stringify(payload));
          const sig = crypto.createHmac("sha256", secret).update(`${eh}.${ep}`).digest("base64")
            .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
          console.log(`${eh}.${ep}.${sig}`);
        ')
        PROFILE_HTTP_CODE=$(curl -sS -o /tmp/amo_profile.json -w "%{http_code}" \
          -H "Authorization: JWT $TOKEN" \
          https://addons.mozilla.org/api/v5/accounts/profile/)
        if [ "$PROFILE_HTTP_CODE" != "200" ]; then
          echo "AMO profile check failed with HTTP $PROFILE_HTTP_CODE."
          exit 1
        fi
        ADDON_HTTP_CODE=$(curl -sS -o /tmp/amo_addon.json -w "%{http_code}" \
          https://addons.mozilla.org/api/v5/addons/addon/%40ci-browser-extension/?lang=en-US)
        if [ "$ADDON_HTTP_CODE" != "200" ]; then
          echo "AMO listing lookup failed with HTTP $ADDON_HTTP_CODE."
          exit 1
        fi
        node -e '
          const fs = require("fs");
          const profile = JSON.parse(fs.readFileSync("/tmp/amo_profile.json", "utf8"));
          const addon = JSON.parse(fs.readFileSync("/tmp/amo_addon.json", "utf8"));
          const author = addon.authors.find(({ id }) => id === profile.id);
          if (!author) {
            console.error(`AMO credentials belong to account ${profile.id}, which is not an owner or co-author of ${addon.guid}.`);
            console.error(`Current listing author IDs: ${addon.authors.map(({ id }) => id).join(", ")}`);
            process.exit(1);
          }
          console.log(`AMO credentials authenticated as listing author ${profile.id} for ${addon.guid}.`);
        '

    - name: Firefox AMO credentials not configured
      if: env.FIREFOX_READY != 'true'
      run: echo "AMO_JWT_ISSUER/AMO_JWT_SECRET not set — skipping."

    - name: Verify Chrome Web Store credentials
      if: env.CHROME_READY == 'true'
      env:
        CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
        CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
        CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      run: |
        set -euo pipefail
        HTTP_CODE=$(curl -sS -o /tmp/chrome_response.json -w "%{http_code}" \
          -X POST https://oauth2.googleapis.com/token \
          -d "client_id=$CHROME_CLIENT_ID" \
          -d "client_secret=$CHROME_CLIENT_SECRET" \
          -d "refresh_token=$CHROME_REFRESH_TOKEN" \
          -d "grant_type=refresh_token")
        echo "Google OAuth token endpoint responded with HTTP $HTTP_CODE"
        if [ "$HTTP_CODE" = "200" ]; then
          echo "Chrome Web Store credentials are valid (access token obtained)."
        else
          echo "Chrome Web Store credentials failed validation:"
          cat /tmp/chrome_response.json
          exit 1
        fi

    - name: Chrome Web Store credentials not configured
      if: env.CHROME_READY != 'true'
      run: echo "CHROME_CLIENT_ID/CHROME_CLIENT_SECRET/CHROME_REFRESH_TOKEN not set — skipping."

    - name: Verify Microsoft Edge Add-ons credentials
      if: env.EDGE_READY == 'true'
      env:
        EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
        EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
      run: |
        set -euo pipefail
        if [[ ! "$EDGE_PRODUCT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
          echo "EDGE_PRODUCT_ID must be the GUID shown on the Partner Center listing page."
          exit 1
        fi
        # This is a read-only probe. A deliberately nonexistent operation ID
        # should return 404 for an authorized product; 401/403 means the API
        # key or Client ID was rejected. The probe cannot verify store ownership
        # when the product ID itself is wrong, so confirm that value in Partner Center.
        HTTP_CODE=$(curl --silent --show-error -o /tmp/edge_response.json -w "%{http_code}" \
          -H "Authorization: ApiKey $EDGE_API_KEY" \
          -H "X-ClientID: $EDGE_CLIENT_ID" \
          "https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions/draft/package/operations/00000000-0000-0000-0000-000000000000")
        case "$HTTP_CODE" in
          200)
            echo "Edge Add-ons v1.1 credential probe reached the API (HTTP 200)."
            ;;
          404)
            echo "Edge Add-ons v1.1 credentials reached the API; the expected missing-operation response was HTTP 404. Confirm the product ID belongs to this Partner Center account."
            ;;
          401|403)
            echo "Edge Add-ons rejected the API key or Client ID (HTTP $HTTP_CODE)."
            exit 1
            ;;
          *)
            echo "Edge Add-ons credential probe returned HTTP $HTTP_CODE."
            exit 1
            ;;
        esac

    - name: Edge Add-ons credentials not configured
      if: env.EDGE_READY != 'true'
      run: echo "EDGE_PRODUCT_ID/EDGE_CLIENT_ID/EDGE_API_KEY not set — skipping."
